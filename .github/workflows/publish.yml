name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.11.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:module-package
      - run: pnpm size
      - run: pnpm build:playground
      - run: pnpm --filter nuxt-photo-playground-tw build
      - run: pnpm build:docs
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - run: pnpm release:pack

      - run: mkdir -p .release
      - run: pnpm --dir packages/vue pack --pack-destination ../../.release
      - run: pnpm --dir packages/nuxt pack --pack-destination ../../.release

      - run: npm publish .release/nuxt-photo-vue-*.tgz --access public --provenance
      - run: npm publish .release/nuxt-photo-nuxt-*.tgz --access public --provenance
