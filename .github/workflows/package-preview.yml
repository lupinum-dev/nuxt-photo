name: Package preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: .node-version
          run-install: false
          cache: false

      - name: Install dependencies from the frozen lockfile
        run: vp install --frozen-lockfile

      - name: Build disposable certified tarballs
        id: artifact
        run: node scripts/build-package-preview.mjs

      - name: Publish commit-addressed previews
        id: publish
        shell: bash
        env:
          PREVIEW_MANIFEST: ${{ steps.artifact.outputs.manifest }}
        run: |
          mapfile -t TARBALLS < <(node -e "const m=require('./' + process.env.PREVIEW_MANIFEST); for (const p of m.packages) console.log(p.tarball)")
          vp exec pkg-pr-new publish \
            --no-compact \
            --comment=update \
            --commentWithSha \
            --no-template \
            --packageManager=pnpm,npm \
            "${TARBALLS[@]}"

      - name: Verify hosted preview URLs and bytes
        env:
          PREVIEW_SHA: ${{ steps.publish.outputs.sha }}
          PREVIEW_URLS: ${{ steps.publish.outputs.urls }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/verify-package-preview.mjs "${{ steps.artifact.outputs.manifest }}"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: package-preview-${{ github.run_id }}
          path: ${{ steps.artifact.outputs.directory }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
