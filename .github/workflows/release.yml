name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact fixed version from both package manifests
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-nuxt-photo
  cancel-in-progress: false

jobs:
  verify:
    name: Verify certified artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      ci_run_id: ${{ steps.ci.outputs.run-id }}
      sha: ${{ steps.ci.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Require current main and successful CI
        id: ci
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          script: |
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_VERSION)) {
              core.setFailed('The release version is not valid SemVer.')
              return
            }
            const { data: repository } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            if (context.ref !== `refs/heads/${repository.default_branch}`) {
              core.setFailed(`Dispatch from ${repository.default_branch}.`)
              return
            }
            if (repository.visibility !== 'public') {
              core.setFailed('npm provenance requires a public repository.')
              return
            }
            const { data: currentMain } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${repository.default_branch}`,
            })
            if (currentMain.object.sha !== context.sha) {
              core.setFailed('The dispatch SHA is not current main.')
              return
            }
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: repository.default_branch,
              event: 'push',
              status: 'completed',
              per_page: 20,
            })
            const run = runs.workflow_runs.find(candidate =>
              candidate.conclusion === 'success' && candidate.head_sha === context.sha,
            )
            if (!run) {
              core.setFailed(`Current main ${context.sha} has no successful ci.yml push run.`)
              return
            }
            let environment
            try {
              environment = (await github.request(
                'GET /repos/{owner}/{repo}/environments/{environment_name}',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  environment_name: 'npm',
                },
              )).data
            } catch (error) {
              if (error.status === 404) {
                core.setFailed('Create the protected npm environment before publication.')
                return
              }
              throw error
            }
            const reviewers = (environment.protection_rules ?? [])
              .find(rule => rule.type === 'required_reviewers')?.reviewers ?? []
            if (reviewers.length === 0) {
              core.setFailed('The npm environment must require a human reviewer.')
              return
            }
            core.setOutput('sha', context.sha)
            core.setOutput('run-id', String(run.id))

      - name: Require an unused release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION")
          case "$status" in
            404) ;;
            200) echo "Tag v$RELEASE_VERSION already exists" >&2; exit 1 ;;
            *) echo "Could not verify tag availability (HTTP $status)" >&2; exit 1 ;;
          esac

      - name: Checkout certified SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.ci.outputs.sha }}

      - name: Set up verification Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Download retained release candidate
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          github-token: ${{ github.token }}
          name: release-candidate
          path: .release
          run-id: ${{ steps.ci.outputs.run-id }}

      - name: Verify publication authorization
        run: >-
          node scripts/verify-release-artifact.mjs .release
          --expected-sha "${{ steps.ci.outputs.sha }}"
          --publishable

      - name: Prepare exact release plan
        id: release
        run: >-
          node scripts/prepare-release.mjs .release
          --expected-sha "${{ steps.ci.outputs.sha }}"
          --ci-run-id "${{ steps.ci.outputs.run-id }}"
          --expected-version "${{ inputs.version }}"
          --summary "$GITHUB_STEP_SUMMARY"
          --github-output "$GITHUB_OUTPUT"

      - name: Upload verified release plan
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-nuxt-photo-release
          path: |
            .release/*.tgz
            .release/release-artifact.json
            .release/release-record.json
            .release/github-release-notes.md
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 2

  publish:
    name: Publish fixed package set to npm
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Set up trusted publishing Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Download verified release plan
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: verified-nuxt-photo-release
          path: .release

      - name: Publish inert tarballs in dependency order
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          import { join } from 'node:path'

          const fail = message => { throw new Error(message) }
          const run = (args, options = {}) => spawnSync('npm', args, {
            encoding: 'utf8',
            stdio: options.inherit ? 'inherit' : ['ignore', 'pipe', 'pipe'],
          })
          const view = (spec, field) => {
            const result = run(['view', spec, field, '--json'])
            if (result.status === 0) return JSON.parse(result.stdout.trim() || 'null')
            if (/E404|404 Not Found/.test(result.stderr)) return null
            fail(`npm view failed for ${spec} ${field}: ${result.stderr.trim()}`)
          }
          const hash = (path, algorithm) => createHash(algorithm).update(readFileSync(path)).digest('hex')
          const artifact = JSON.parse(readFileSync('.release/release-artifact.json', 'utf8'))
          const record = JSON.parse(readFileSync('.release/release-record.json', 'utf8'))
          if (record.schemaVersion !== 2) fail('Unsupported release record.')
          if (record.sourceSha !== process.env.SOURCE_SHA || artifact.sourceSha !== record.sourceSha) fail('Source SHA differs.')
          if (record.version !== process.env.RELEASE_VERSION || artifact.packageSetVersion !== record.version) fail('Version differs.')
          const expectedOrder = ['@lupinum/vue-photo', '@lupinum/nuxt-photo']
          if (JSON.stringify(record.publishOrder) !== JSON.stringify(expectedOrder)) fail('Publish order differs.')
          const npmVersion = run(['--version']).stdout.trim().split('.').map(Number)
          if (npmVersion[0] < 11 || (npmVersion[0] === 11 && npmVersion[1] < 5)) fail('npm 11.5 or newer is required.')

          for (const name of expectedOrder) {
            const pkg = record.packages.find(candidate => candidate.name === name)
            if (!pkg) fail(`Missing ${name}.`)
            const tarball = join('.release', pkg.tarball)
            if (hash(tarball, 'sha1') !== pkg.sha1 || hash(tarball, 'sha256') !== pkg.sha256) fail(`${name} failed digest verification.`)
            const existing = view(`${name}@${pkg.version}`, 'dist.shasum')
            if (existing && existing !== pkg.sha1) fail(`${name}@${pkg.version} exists with different bytes.`)
            if (!existing) {
              const result = run([
                'publish', tarball, '--access', 'public', '--tag', record.channel,
                '--ignore-scripts', '--provenance',
              ], { inherit: true })
              if (result.status !== 0) fail(`npm publish failed for ${name}.`)
            }
          }

          for (const pkg of record.packages) {
            let verified = false
            for (let attempt = 0; attempt < 12; attempt += 1) {
              const shasum = view(`${pkg.name}@${pkg.version}`, 'dist.shasum')
              const attestations = view(`${pkg.name}@${pkg.version}`, 'dist.attestations')
              const channel = view(pkg.name, `dist-tags.${record.channel}`)
              if (shasum === pkg.sha1 && attestations && channel === pkg.version) {
                verified = true
                break
              }
              Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 5000)
            }
            if (!verified) fail(`${pkg.name}@${pkg.version} did not expose matching bytes, provenance, and ${record.channel}.`)
          }
          NODE

  github-release:
    name: Create GitHub release
    needs:
      - verify
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified release plan
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: verified-nuxt-photo-release
          path: .release

      - name: Create release from the exact certified package set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.verify.outputs.channel }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          prerelease=()
          if [ "$RELEASE_CHANNEL" = next ]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" .release/*.tgz .release/release-artifact.json .release/release-record.json \
            --target "$SOURCE_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file .release/github-release-notes.md \
            "${prerelease[@]}"
