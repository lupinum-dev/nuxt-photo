name: Publish

on:
  workflow_dispatch: {}
  workflow_run:
    workflows:
      - ci
    types:
      - completed

permissions: {}

concurrency:
  group: publish-nuxt-photo
  cancel-in-progress: false

jobs:
  verify:
    name: Verify certified artifacts
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      action: ${{ steps.intent.outputs.action || steps.state.outputs.action }}
      channel: ${{ steps.release.outputs.channel }}
      ci_run_id: ${{ steps.ci.outputs.run-id }}
      sha: ${{ steps.ci.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Require current main and successful CI
        id: ci
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const { data: repository } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            if (repository.visibility !== 'public') {
              core.setFailed('npm provenance requires a public repository.')
              return
            }
            const { data: currentMain } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${repository.default_branch}`,
            })
            const sourceSha = context.eventName === 'workflow_run'
              ? context.payload.workflow_run.head_sha
              : currentMain.object.sha
            const isHistoricalRetry = context.eventName === 'workflow_run' &&
              Number(process.env.RUN_ATTEMPT) > 1
            if (sourceSha !== currentMain.object.sha && !isHistoricalRetry) {
              core.setFailed('The successful CI SHA is no longer current main.')
              return
            }
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: repository.default_branch,
              event: 'push',
              status: 'completed',
              per_page: 20,
            })
            const successfulRuns = runs.workflow_runs.filter(candidate =>
              candidate.conclusion === 'success' && candidate.head_sha === sourceSha,
            )
            const candidates = []
            for (const run of successfulRuns) {
              const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              })
              if (artifacts.artifacts.filter(artifact =>
                artifact.name === 'release-candidate' && !artifact.expired,
              ).length === 1) candidates.push(run)
            }
            const eventRunId = context.payload.workflow_run?.id
            const selected = context.eventName === 'workflow_run'
              ? candidates.filter(run => run.id === eventRunId)
              : candidates
            if (selected.length !== 1) {
              core.setFailed(
                `Expected exactly one successful current-main CI run with a retained release-candidate artifact; found ${selected.length}.`,
              )
              return
            }
            let environment
            try {
              environment = (await github.request(
                'GET /repos/{owner}/{repo}/environments/{environment_name}',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  environment_name: 'npm',
                },
              )).data
            } catch (error) {
              if (error.status === 404) {
                core.setFailed('Create the protected npm environment before publication.')
                return
              }
              throw error
            }
            const reviewers = (environment.protection_rules ?? [])
              .find(rule => rule.type === 'required_reviewers')?.reviewers ?? []
            if (reviewers.length === 0) {
              core.setFailed('The npm environment must require a human reviewer.')
              return
            }
            core.setOutput('sha', sourceSha)
            core.setOutput('run-id', String(selected[0].id))

      - name: Checkout certified SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.ci.outputs.sha }}

      - name: Check reviewed release intent
        id: intent
        run: |
          pending="$(node --input-type=module -e "import { listPendingChangesets } from './scripts/lib/changelog.mjs'; process.stdout.write(String(listPendingChangesets(process.cwd()).length))")"
          if test "$pending" = 0; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'action=waiting' >> "$GITHUB_OUTPUT"
            {
              echo '# Nuxt Photo release'
              echo
              echo 'Release intent is still represented by pending Changesets.'
              echo
              echo '**Next action:** Review and merge the generated version pull request after its checks pass.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up verification Node
        if: steps.intent.outputs.ready == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install locked Sigstore verifier
        if: steps.intent.outputs.ready == 'true'
        env:
          SIGSTORE_PREFIX: ${{ runner.temp }}/sigstore
        run: |
          mkdir -p "$SIGSTORE_PREFIX"
          cp scripts/sigstore-verifier/package.json \
            scripts/sigstore-verifier/package-lock.json \
            "$SIGSTORE_PREFIX/"
          npm ci --prefix "$SIGSTORE_PREFIX" --ignore-scripts --no-audit --no-fund

      - name: Download retained release candidate
        if: steps.intent.outputs.ready == 'true'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          github-token: ${{ github.token }}
          name: release-candidate
          path: .release
          run-id: ${{ steps.ci.outputs.run-id }}

      - name: Verify publication authorization
        if: steps.intent.outputs.ready == 'true'
        run: >-
          node scripts/verify-release-artifact.mjs .release
          --expected-sha "${{ steps.ci.outputs.sha }}"
          --publishable

      - name: Prepare exact release plan
        if: steps.intent.outputs.ready == 'true'
        id: release
        run: >-
          node scripts/prepare-release.mjs .release
          --expected-sha "${{ steps.ci.outputs.sha }}"
          --ci-run-id "${{ steps.ci.outputs.run-id }}"
          --summary "$GITHUB_STEP_SUMMARY"
          --github-output "$GITHUB_OUTPUT"

      - name: Cryptographically verify existing npm packages
        if: steps.intent.outputs.ready == 'true'
        env:
          SIGSTORE_PREFIX: ${{ runner.temp }}/sigstore
        run: >-
          node scripts/verify-registry-provenance.mjs .release
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Derive reconciliation state
        if: steps.intent.outputs.ready == 'true'
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/plan-reconciliation.mjs .release
          --summary "$GITHUB_STEP_SUMMARY"
          --github-output "$GITHUB_OUTPUT"

      - name: Upload verified release plan
        if: steps.intent.outputs.ready == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-nuxt-photo-release
          path: |
            .release/*.tgz
            .release/release-artifact.json
            .release/release-record.json
            .release/registry-verification.json
            .release/github-release-notes.md
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  publish:
    name: Publish fixed package set to npm
    needs: verify
    if: needs.verify.outputs.action == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Set up trusted publishing Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Download verified release plan
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: verified-nuxt-photo-release
          path: .release

      - name: Publish inert tarballs in dependency order
        id: publish
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { join } from 'node:path'

          const fail = message => { throw new Error(message) }
          const run = (args, options = {}) => spawnSync('npm', args, {
            encoding: 'utf8',
            stdio: options.inherit ? 'inherit' : ['ignore', 'pipe', 'pipe'],
          })
          const view = (spec, field) => {
            const result = run(['view', spec, field, '--json'])
            if (result.status === 0) return JSON.parse(result.stdout.trim() || 'null')
            if (/E404|404 Not Found/.test(result.stderr)) return null
            fail(`npm view failed for ${spec} ${field}: ${result.stderr.trim()}`)
          }
          const hasAttestations = value => Array.isArray(value)
            ? value.length > 0
            : Boolean(value && typeof value === 'object' && Object.keys(value).length)
          const hashBytes = (bytes, algorithm) => createHash(algorithm).update(bytes).digest('hex')
          const hash = (path, algorithm) => hashBytes(readFileSync(path), algorithm)
          const artifact = JSON.parse(readFileSync('.release/release-artifact.json', 'utf8'))
          const releaseRecordBytes = readFileSync('.release/release-record.json')
          const record = JSON.parse(releaseRecordBytes.toString('utf8'))
          const verification = JSON.parse(
            readFileSync('.release/registry-verification.json', 'utf8'),
          )
          const pollAttempts = Number(process.env.REGISTRY_POLL_ATTEMPTS ?? 240)
          const pollDelayMs = Number(process.env.REGISTRY_POLL_DELAY_MS ?? 5000)
          if (!Number.isSafeInteger(pollAttempts) || pollAttempts < 1) fail('Invalid registry poll attempt count.')
          if (pollAttempts > 240) fail('Invalid registry poll attempt limit.')
          if (!Number.isSafeInteger(pollDelayMs) || pollDelayMs < 0) fail('Invalid registry poll delay.')
          if (pollAttempts * pollDelayMs > 20 * 60 * 1000) fail('Invalid registry poll budget.')
          if (record.schemaVersion !== 2) fail('Unsupported release record.')
          if (record.sourceSha !== process.env.SOURCE_SHA || artifact.sourceSha !== record.sourceSha) fail('Source SHA differs.')
          if (record.version !== process.env.RELEASE_VERSION || artifact.packageSetVersion !== record.version) fail('Version differs.')
          const expectedOrder = ['@lupinum/vue-photo', '@lupinum/nuxt-photo']
          const expectedWorkflow = {
            repository: 'https://github.com/lupinum-dev/nuxt-photo',
            path: '.github/workflows/release.yml',
            ref: 'refs/heads/main',
            identity: 'https://github.com/lupinum-dev/nuxt-photo/.github/workflows/release.yml@refs/heads/main',
            certificateIssuer: 'https://token.actions.githubusercontent.com',
            certificateOIDs: {
              '1.3.6.1.4.1.57264.1.3': record.sourceSha,
              '1.3.6.1.4.1.57264.1.5': 'lupinum-dev/nuxt-photo',
              '1.3.6.1.4.1.57264.1.6': 'refs/heads/main',
            },
          }
          if (JSON.stringify(record.publishOrder) !== JSON.stringify(expectedOrder)) fail('Publish order differs.')
          if (
            verification.schemaVersion !== 1 ||
            verification.releaseRecordSha256 !== hashBytes(releaseRecordBytes, 'sha256') ||
            verification.sourceSha !== record.sourceSha ||
            verification.version !== record.version ||
            verification.channel !== record.channel ||
            verification.sigstoreVersion !== '5.0.0' ||
            JSON.stringify(verification.workflow) !== JSON.stringify(expectedWorkflow)
          ) fail('Registry verification record differs from the exact release plan.')
          if (
            !Array.isArray(record.packages) || record.packages.length !== expectedOrder.length ||
            !Array.isArray(verification.packages) || verification.packages.length !== expectedOrder.length ||
            JSON.stringify(verification.packages.map(pkg => pkg.name)) !== JSON.stringify(expectedOrder)
          ) fail('Registry verification package set differs.')
          const npmVersion = run(['--version']).stdout.trim().split('.').map(Number)
          if (npmVersion[0] < 11 || (npmVersion[0] === 11 && npmVersion[1] < 5)) fail('npm 11.5 or newer is required.')

          const plans = []
          for (const name of expectedOrder) {
            const releaseMatches = record.packages.filter(candidate => candidate.name === name)
            const verificationMatches = verification.packages.filter(candidate => candidate.name === name)
            if (releaseMatches.length !== 1 || verificationMatches.length !== 1) {
              fail(`Missing or duplicate ${name}.`)
            }
            const pkg = releaseMatches[0]
            const verified = verificationMatches[0]
            const tarball = join('.release', pkg.tarball)
            if (
              !/^[A-Za-z0-9._-]+\.tgz$/.test(pkg.tarball) ||
              verified.version !== pkg.version || verified.tarball !== pkg.tarball ||
              verified.sha1 !== pkg.sha1 || verified.sha256 !== pkg.sha256 ||
              hash(tarball, 'sha1') !== pkg.sha1 ||
              hash(tarball, 'sha256') !== pkg.sha256 ||
              hash(tarball, 'sha512') !== verified.sha512
            ) fail(`${name} failed exact artifact verification.`)
            if (!['absent', 'oidc'].includes(verified.mode)) {
              fail(`${name} has an invalid registry verification mode.`)
            }
            if (
              (verified.mode === 'oidc' && !/^[0-9a-f]{64}$/.test(verified.provenanceBundleSha256)) ||
              (verified.mode !== 'oidc' && verified.provenanceBundleSha256 !== null)
            ) fail(`${name} has an invalid provenance verification record.`)
            plans.push({ pkg, tarball, verified })
          }

          for (const { pkg, verified } of plans) {
            const spec = `${pkg.name}@${pkg.version}`
            const existing = view(spec, 'dist.shasum')
            const channel = view(pkg.name, `dist-tags.${record.channel}`)
            if (verified.mode === 'absent') {
              if (existing !== null) {
                fail(`${spec} was absent during verification but now exists; rerun verification.`)
              }
              if (channel !== verified.channelVersion) {
                fail(`${pkg.name} ${record.channel} tag changed after verification.`)
              }
              continue
            }
            if (existing !== pkg.sha1) fail(`${spec} changed after verification.`)
            if (channel !== pkg.version || channel !== verified.channelVersion) {
              fail(`${pkg.name} ${record.channel} tag changed after verification.`)
            }
            const attestations = view(spec, 'dist.attestations')
            if (verified.mode === 'oidc' && !hasAttestations(attestations)) {
              fail(`${spec} lost its verified npm provenance metadata.`)
            }
          }

          for (const { pkg, tarball, verified } of plans) {
            if (verified.mode === 'absent') {
              const result = run([
                'publish', tarball, '--access', 'public', '--tag', record.channel,
                '--ignore-scripts', '--provenance',
              ], { inherit: true })
              if (result.status !== 0) fail(`npm publish failed for ${pkg.name}.`)
            }
          }

          const verifiedPackages = new Set()
          for (let attempt = 0; attempt < pollAttempts; attempt += 1) {
            for (const pkg of record.packages) {
              if (verifiedPackages.has(pkg.name)) continue
              const shasum = view(`${pkg.name}@${pkg.version}`, 'dist.shasum')
              const attestations = view(`${pkg.name}@${pkg.version}`, 'dist.attestations')
              const channel = view(pkg.name, `dist-tags.${record.channel}`)
              if (
                shasum === pkg.sha1 &&
                channel === pkg.version &&
                hasAttestations(attestations)
              ) {
                verifiedPackages.add(pkg.name)
              }
            }
            if (verifiedPackages.size === record.packages.length) break
            if (attempt + 1 < pollAttempts) {
              Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, pollDelayMs)
            }
          }
          for (const pkg of record.packages) {
            if (!verifiedPackages.has(pkg.name)) {
              fail(`${pkg.name}@${pkg.version} did not expose the required bytes, provenance mode, and ${record.channel}.`)
            }
          }
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            '\nBoth packages expose certified bytes and OIDC provenance.\n',
          )
          NODE

  github-release:
    name: Create GitHub release
    needs:
      - verify
      - publish
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.verify.outputs.action == 'publish' || needs.verify.outputs.action == 'repair') &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified release plan
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: verified-nuxt-photo-release
          path: .release

      - name: Create release from the exact certified package set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.verify.outputs.channel }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          prerelease=false
          if [ "$RELEASE_CHANNEL" = next ]; then prerelease=true; fi
          release_status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          case "$release_status" in
            404) release_exists=false ;;
            200) release_exists=true ;;
            *) echo "Could not verify GitHub release state (HTTP $release_status)" >&2; exit 1 ;;
          esac
          tag_status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          case "$tag_status" in
            404)
              if [ "$release_exists" = true ]; then
                echo "The existing GitHub release has no tag." >&2
                exit 1
              fi
              tag_error="$(mktemp)"
              if ! gh api --silent --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$RELEASE_TAG" \
                -f sha="$SOURCE_SHA" 2>"$tag_error"; then
                if grep -Eq 'Resource not accessible by integration|HTTP 403' "$tag_error"; then
                  echo "HUMAN-ONLY: GitHub could not create historical tag $RELEASE_TAG at certified commit $SOURCE_SHA." >&2
                  echo "Run: git fetch origin && git tag $RELEASE_TAG $SOURCE_SHA && git push origin refs/tags/$RELEASE_TAG" >&2
                  echo "Then verify: git ls-remote origin refs/tags/$RELEASE_TAG" >&2
                  echo "Finally rerun only this failed GitHub release job; do not rebuild or republish." >&2
                fi
                cat "$tag_error" >&2
                exit 1
              fi
              ;;
            200) ;;
            *) echo "Could not verify tag state (HTTP $tag_status)" >&2; exit 1 ;;
          esac
          tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type')
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          while [ "$tag_type" = tag ]; do
            tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.type')
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')
          done
          test "$tag_type" = commit
          test "$tag_sha" = "$SOURCE_SHA"
          if [ "$release_exists" = true ]; then
            gh release upload "$RELEASE_TAG" .release/*.tgz .release/release-artifact.json .release/release-record.json .release/registry-verification.json \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file .release/github-release-notes.md \
              --prerelease="$prerelease"
          else
            create_flags=()
            if [ "$prerelease" = true ]; then create_flags=(--prerelease); fi
            gh release create "$RELEASE_TAG" .release/*.tgz .release/release-artifact.json .release/release-record.json .release/registry-verification.json \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file .release/github-release-notes.md \
              "${create_flags[@]}"
          fi
