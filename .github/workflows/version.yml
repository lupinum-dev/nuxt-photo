name: version

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed

concurrency:
  group: changesets-version
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Prepare version pull request
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ignore completed runs that are no longer current main
        id: freshness
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const defaultBranch = context.payload.repository.default_branch
            const { data: currentMain } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${defaultBranch}`,
            })
            core.setOutput(
              'current',
              currentMain.object.sha === context.payload.workflow_run.head_sha ? 'true' : 'false',
            )

      - name: Checkout verified main SHA
        if: steps.freshness.outputs.current == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Vite+
        if: steps.freshness.outputs.current == 'true'
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: .node-version
          run-install: false
          cache: false

      - name: Install dependencies
        if: steps.freshness.outputs.current == 'true'
        run: vp install --frozen-lockfile

      - name: Create or update version pull request
        if: steps.freshness.outputs.current == 'true'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          commit: 'chore: version Nuxt Photo packages'
          createGithubReleases: false
          prDraft: create
          title: 'chore: version Nuxt Photo packages'
          version: vp run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
