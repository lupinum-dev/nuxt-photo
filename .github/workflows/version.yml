name: version

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed

concurrency:
  group: changesets-version
  cancel-in-progress: false

permissions: {}

jobs:
  prepare-version:
    name: Prepare version patch
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
      sha: ${{ steps.freshness.outputs.sha }}
    steps:
      - name: Ignore completed runs that are no longer current main
        id: freshness
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const defaultBranch = context.payload.repository.default_branch
            const { data: currentMain } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${defaultBranch}`,
            })
            core.setOutput(
              'current',
              currentMain.object.sha === context.payload.workflow_run.head_sha ? 'true' : 'false',
            )
            core.setOutput('sha', context.payload.workflow_run.head_sha)

      - name: Checkout verified main SHA
        if: steps.freshness.outputs.current == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Vite+
        if: steps.freshness.outputs.current == 'true'
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: .node-version
          run-install: false
          cache: false

      - name: Install dependencies
        if: steps.freshness.outputs.current == 'true'
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Generate the version patch without write credentials
        if: steps.freshness.outputs.current == 'true'
        id: patch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          vp run version
          git add --intent-to-add .
          git diff --binary --full-index --output="$RUNNER_TEMP/version.patch"
          if git diff --quiet; then
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
          else
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Retain the inert version patch
        if: steps.freshness.outputs.current == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: version-patch-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/version.patch
          if-no-files-found: error
          retention-days: 1

  version-pr:
    name: Create version pull request
    needs: prepare-version
    if: needs.prepare-version.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the verified main SHA without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare-version.outputs.sha }}

      - name: Download the inert version patch
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: version-patch-${{ needs.prepare-version.outputs.sha }}
          path: ${{ runner.temp }}

      - name: Confirm that the prepared SHA is still current main
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const defaultBranch = context.payload.repository.default_branch
            const { data: currentMain } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${defaultBranch}`,
            })
            if (currentMain.object.sha !== '${{ needs.prepare-version.outputs.sha }}') {
              core.setFailed('The default branch advanced after the version patch was prepared.')
            }

      - name: Apply the prepared patch
        run: git apply --index "$RUNNER_TEMP/version.patch"

      - name: Create or update the draft version pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          base: main
          branch: changeset-release/main
          commit-message: 'chore: version Nuxt Photo packages'
          title: 'chore: version Nuxt Photo packages'
          body: |
            This pull request was generated from reviewed Changesets on a successful main commit.

            Review package versions and changelog entries. Merge only after all required checks pass.
          draft: true
          delete-branch: true
