name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      description: The output of `pnpm why` or `npm ls` for the package, for example `1.2.0`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Framework, runtime and browser versions, for example `Nuxt 4.4.8, Node 24, Safari 19`.
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Reproduction
      description: A link to the smallest public project that shows the problem (StackBlitz or a repository).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What to do in the reproduction, one step per line.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happens
      description: Paste the exact error text or describe what you see. Add a screenshot for a visual problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: checkboxes
    id: checked
    attributes:
      label: Checks
      options:
        - label: I searched the open issues and the troubleshooting page of the docs.
          required: true
