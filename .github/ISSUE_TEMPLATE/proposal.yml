name: Proposal
description: Suggest a feature or a change to the public API.
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What do you want to do?
      description: The task you cannot do today, or can only do with a workaround. Show the workaround.
    validations:
      required: true
  - type: textarea
    id: usage
    attributes:
      label: How would you like to write it?
      description: The code you would like to write, as a user of the package.
      render: ts
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
