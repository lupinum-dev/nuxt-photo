name: Documentation
description: A page is wrong, missing or hard to follow.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL of the page, or the topic you could not find.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: Quote the sentence or code that misled you, and what you expected instead.
    validations:
      required: true
