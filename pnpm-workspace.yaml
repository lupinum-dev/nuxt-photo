packages:
  - 'packages/*'
  - 'playground'
  - 'playground-tailwind'
  - 'docs'

overrides:
  js-yaml: 4.3.0
  launch-editor: 2.14.1
  tar: 7.5.19
  undici: 7.28.0
  ws: 8.21.0

minimumReleaseAgeExclude:
  - '@iconify/collections@1.0.710'
  - '@lupinum/ginko-content@0.3.0-rc.2'
  - 'electron-to-chromium@1.5.392'

allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  better-sqlite3: true
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false
