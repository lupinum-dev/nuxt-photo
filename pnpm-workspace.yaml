packages:
  - 'packages/*'
  - 'playground'
  - 'playground-tailwind'
  - 'docs'

catalog:
  nuxt: 4.5.2
  rolldown: 1.2.1
  typescript: 5.9.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.4
  vite-plus: 0.2.4
  vitest: 4.1.10
  vue: 3.5.42
  vue-tsc: 3.2.7

overrides:
  # Security floors for transitive build and documentation dependencies.
  # Remove an override after every parent resolves a patched version. Review after 2026-09-01.
  '@hono/node-server': 1.19.15
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.4
  'brace-expansion@>=4.0.0 <5.0.9': 5.0.9
  browserslist: 4.28.7
  esbuild: 0.28.1
  fast-uri: 3.1.6
  'fflate@>=0.7.0 <0.7.5': 0.7.5
  'qs@>=2.2.5 <6.16.0': 6.16.0
  hono: 4.12.34
  ip-address: 10.3.1
  js-yaml: 4.3.1
  'read-yaml-file>js-yaml': 3.15.1
  launch-editor: 2.14.1
  nanoid: 3.3.18
  postcss: 8.5.23
  tar: 7.5.22
  sharp: 0.35.0
  undici: 7.29.0
  vite: 'catalog:'
  vitest: 'catalog:'
  ws: 8.21.0

autoInstallPeers: false
enableGlobalVirtualStore: false
preferFrozenLockfile: true
strictPeerDependencies: true
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  better-sqlite3: true
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false
