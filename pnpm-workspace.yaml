packages:
  - 'packages/*'
  - 'playground'
  - 'docs'
  - 'demo'

# Refuse to install on an unsupported Node.js, and save exact versions.
engineStrict: true
saveExact: true

catalog:
  nuxt: 4.5.2
  rolldown: 1.2.12
  typescript: 5.9.3
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vite-plus: 0.3.3
  vitest: 5.0.3
  vue: 3.5.43
  vue-tsc: 3.3.12

overrides:
  # Image 2.1's Node IPX adapter hangs internal fetches during docs prerendering.
  '@nuxt/image': 2.0.0
  # Security floors for transitive build and documentation dependencies.
  # Remove an override after every parent resolves a patched version. Review after 2026-11-01.
  '@hono/node-server': 1.19.17
  seroval: 1.6.8
  source-map-js: 1.2.2
  postcss-selector-parser: 7.1.6
  # Keep vite-plus's bundled Vitest browser packages on the same release as vitest.
  '@vitest/browser': 5.0.3
  '@vitest/browser-preview': 5.0.3
  '@vitest/mocker': 5.0.3
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.7
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  browserslist: 4.29.3
  devalue: 5.9.4
  esbuild: 0.28.2
  fast-uri: 3.1.8
  'fflate@>=0.7.0 <0.7.5': 0.8.3
  'qs@>=2.2.5 <6.16.0': 6.16.0
  hono: 4.13.13
  ip-address: 10.7.3
  js-yaml: 4.3.2
  'read-yaml-file>js-yaml': 3.15.2
  # module-builder's mkdist peer still requires transformer 0.1.
  # Keep the compatible transformer until mkdist supports 0.2.
  '@nuxt/module-builder>vue-sfc-transformer': 0.1.17
  launch-editor: 2.14.1
  nanoid: 3.3.19
  postcss: 8.5.28
  tar: 7.5.22
  sharp: 0.35.5
  svgo: 4.1.0
  undici: 7.30.0
  vite: 'catalog:'
  vitest: 'catalog:'
  ws: 8.22.0

autoInstallPeers: false
enableGlobalVirtualStore: false
preferFrozenLockfile: true
strictPeerDependencies: true
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  better-sqlite3: true
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false
