packages:
  - 'packages/*'
  - 'playground'
  - 'playground-tailwind'
  - 'docs'

catalog:
  nuxt: 4.5.2
  rolldown: 1.2.1
  typescript: 5.9.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.4
  vite-plus: 0.2.4
  vitest: 4.1.11
  vue: 3.5.42
  vue-tsc: 3.2.7

overrides:
  # Security floors for transitive build and documentation dependencies.
  # Remove an override after every parent resolves a patched version. Review after 2026-11-01.
  '@hono/node-server': 1.19.15
  # Keep vite-plus's bundled Vitest browser packages on the same release as vitest.
  '@vitest/browser': 4.1.11
  '@vitest/browser-preview': 4.1.11
  '@vitest/mocker': 4.1.11
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.7
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  browserslist: 4.28.7
  devalue: 5.9.4
  esbuild: 0.28.1
  fast-uri: 3.1.8
  'fflate@>=0.7.0 <0.7.5': 0.7.5
  'qs@>=2.2.5 <6.16.0': 6.16.0
  hono: 4.13.11
  ip-address: 10.7.2
  js-yaml: 4.3.2
  'read-yaml-file>js-yaml': 3.15.2
  launch-editor: 2.14.1
  nanoid: 3.3.18
  postcss: 8.5.23
  tar: 7.5.22
  sharp: 0.35.5
  svgo: 4.1.0
  undici: 7.29.1
  vite: 'catalog:'
  vitest: 'catalog:'
  ws: 8.21.0

autoInstallPeers: false
enableGlobalVirtualStore: false
preferFrozenLockfile: true
strictPeerDependencies: true
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  better-sqlite3: true
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false
